<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
        form { display: grid; gap: 0.75rem; }
        label { display: flex; flex-direction: column; font-size: 0.9rem; }
        input { padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Log In</h1>
    {% if error %}
    <p style="color: #c0392b; margin-bottom: 0.5rem;">{{ error }}</p>
    {% endif %}
    <form action="/login" method="post">
        <label>Email
            <input type="email" name="email" value="{{ email or '' }}" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Log In</button>
    </form>
    <p>Don't have an account? <a href="/signup">Sign up</a></p>
</body>
</html>
